name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    # Dashboard smoke tests and the unit tests for src/metrics.js (vitest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    # Adapter contract tests (node:test). No credentials and no network:
    # every upstream call is stubbed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
